<!--
  Koodijupp mkm.ee veebimeeskonnale.
  Lisab näidikulaua sisulehele iframe'ina ja muudab iframe'i kõrgust
  vastavalt sisule (leht saadab oma kõrguse postMessage'iga).

  Asenda NAIDIKULAUD_URL tegeliku aadressiga, näiteks
  https://naitajad.mkm.ee/ või https://<organisatsioon>.github.io/mkm-majandusnaitajad/
-->
<iframe id="mkm-naitajad"
        src="NAIDIKULAUD_URL"
        title="Eesti majandusnäitajad"
        style="width:100%;height:1400px;border:0;display:block"
        loading="lazy"></iframe>
<p><a href="NAIDIKULAUD_URL">Ava majandusnäitajad eraldi lehel</a></p>
<script>
  (function () {
    var lubatud = new URL('NAIDIKULAUD_URL').origin;
    window.addEventListener('message', function (e) {
      if (e.origin !== lubatud || !e.data || e.data.tyyp !== 'mkm-naitajad-korgus') return;
      var k = Number(e.data.korgus);
      if (k > 200 && k < 20000) document.getElementById('mkm-naitajad').style.height = k + 'px';
    });
  })();
</script>
