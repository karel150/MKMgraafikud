# Ajutine: Maailmapanga Data360 API ülesehituse uurimine. Haru kustutatakse pärast kasutamist.
name: diag
on:
  push:
    branches: [diag-wb]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          B=https://data360api.worldbank.org/data360
          for I in WB_WDI_IC_BRE_P1_RF WB_WDI_IC_BRE_P2_PS WB_WDI_IC_BRE_P3_OE; do
            echo "=== $I EST"; curl -sS -m 60 "$B/data?DATABASE_ID=WB_WDI&INDICATOR=$I&REF_AREA=EST" | jq -c '{count, rows: (.value|map({TIME_PERIOD,OBS_VALUE,UNIT_MEASURE,COMP_BREAKDOWN_1}))}' | cut -c1-600
            echo "=== $I kõik"; curl -sS -m 60 "$B/data?DATABASE_ID=WB_WDI&INDICATOR=$I" -o x.json; jq -c '{count, n: (.value|length), tp: ([.value[].TIME_PERIOD]|group_by(.)|map({(.[0]): length})|add), areas: ([.value[].REF_AREA]|unique|length)}' x.json | cut -c1-500
            jq -r '[.value[].REF_AREA]|unique|join(" ")' x.json | cut -c1-900
          done
          echo "=== WB_BREADY kõik"; curl -sS -m 60 "$B/data?DATABASE_ID=WB_BREADY" -o y.json; jq -c '{count, n: (.value|length), tp: ([.value[].TIME_PERIOD]|group_by(.)|map({(.[0]): length})|add), areas: ([.value[].REF_AREA]|unique|length)}' y.json | cut -c1-500
          echo "=== WGI kõik mõõtmed ühe päringuga"; curl -sS -m 60 "$B/data?DATABASE_ID=WB_WGI&COMP_BREAKDOWN_1=WGI_SC&timePeriodFrom=2024&timePeriodTo=2025" | jq -c '{count, n: (.value|length), ind: ([.value[].INDICATOR]|unique), tp: ([.value[].TIME_PERIOD]|unique)}'
