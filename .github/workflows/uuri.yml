name: Uuri allikat (ajutine)
on:
  push:
    branches: [uuri-tootukassa]
permissions:
  contents: write
jobs:
  uuri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lae
        run: |
          mkdir -p uuri
          curl -sL -o uuri/s1.json "https://andmed.eesti.ee/api/datasets?search=t%C3%B6%C3%B6tud&limit=75" || true
          curl -sL -o uuri/s2.json "https://andmed.eesti.ee/api/datasets?search=p%C3%A4evane&limit=75" || true
          curl -sL -o uuri/s3.json "https://andmed.eesti.ee/api/datasets?search=t%C3%B6%C3%B6tuse%20m%C3%A4%C3%A4r%20registreeritud&limit=75" || true
          rm -f uuri/kuu.xlsx uuri/mk.xlsx uuri/tk.html uuri/ds_slug.json
          ls -la uuri
      - name: Salvesta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A uuri && git commit -m "Uurimistulemus 3" && git push
