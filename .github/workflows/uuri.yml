name: Uuri allikat (ajutine)
on:
  push:
    branches: [uuri-tootukassa]
permissions:
  contents: write
jobs:
  uuri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lae
        run: |
          mkdir -p uuri
          curl -sL -o uuri/org.json -w "org %{http_code}\n" "https://andmed.eesti.ee/api/datasets?organizationId=1ec19d59-10a7-4cd0-97a7-6c1b94e31ba4&limit=100" || true
          curl -sL -o uuri/org2.json -w "org2 %{http_code}\n" "https://andmed.eesti.ee/api/datasets?search=t%C3%B6%C3%B6tukassa&limit=100" || true
          curl -sL -o uuri/kuu.xlsx -w "kuu %{http_code}\n" "https://andmed.eesti.ee/api/v2/datasets/e7ce24f2-7c77-403a-8559-12e9fd75b249/distribution/$(python3 -c "import json;d=json.load(open('uuri/ds.json'));print([x['id'] for x in d['distributions'] if x['titleEt'].startswith('Kuu jooksul')][0])")/file" || true
          curl -sL -o uuri/mk.xlsx -w "mk %{http_code}\n" "https://andmed.eesti.ee/api/v2/datasets/e7ce24f2-7c77-403a-8559-12e9fd75b249/distribution/$(python3 -c "import json;d=json.load(open('uuri/ds.json'));print([x['id'] for x in d['distributions'] if 'maakonna ja soo' in x['titleEt']][0])")/file" || true
          ls -la uuri
      - name: Salvesta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uuri && git commit -m "Uurimistulemus 2" && git push
