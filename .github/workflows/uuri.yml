name: Uuri allikat (ajutine)
on:
  push:
    branches: [uuri-tootukassa]
permissions:
  contents: write
jobs:
  uuri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lae
        run: |
          mkdir -p uuri
          rm -f uuri/paev_* uuri/kov.xlsx
          for pat in "tegevusala" "ameti ja vanuse" "registreeritud tootuse kestuse"; do
            ID=$(python3 -c "import json,sys;d=json.load(open('uuri/ds.json'));print([x['id'] for x in d['distributions'] if sys.argv[1] in x['titleEt']][0])" "$pat")
            curl -sL -o "uuri/f_${pat// /_}.xlsx" "https://andmed.eesti.ee/api/v2/datasets/e7ce24f2-7c77-403a-8559-12e9fd75b249/distribution/$ID/file" || true
          done
          ls -la uuri
      - name: Salvesta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A uuri && git commit -m "Uurimistulemus 5" && git push
