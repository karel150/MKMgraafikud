name: Uuri allikat (ajutine)
on:
  push:
    branches: [uuri-tootukassa]
permissions:
  contents: write
jobs:
  uuri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lae
        run: |
          mkdir -p uuri
          rm -f uuri/f_*.xlsx uuri/paev.json
          for q in "t%C3%B6%C3%B6kohad" "t%C3%B6%C3%B6pakkumised" "vabad" "t%C3%B6%C3%B6tukassa%20t%C3%B6%C3%B6kohad"; do
            curl -sL -o "uuri/q_$q.json" "https://andmed.eesti.ee/api/datasets?search=$q&limit=75" || true
          done
          ls -la uuri
      - name: Salvesta
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A uuri && git commit -m "Uurimistulemus 6" && git push
